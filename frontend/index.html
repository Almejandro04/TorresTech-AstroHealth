<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0032A0" />
    <meta name="description" content="AstroHealth — a fictional astronaut mission health monitoring prototype by TorresTech. Synthetic data; not a medical diagnosis." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AstroHealth</title>
    <script>
      // Apply the remembered theme before first paint. Light is the default.
      try {
        if (localStorage.getItem('astrohealth-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
